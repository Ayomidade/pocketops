name: Native build validation
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm exec --workspace=mobile -- expo prebuild --platform android --no-install
        env:
          CI: "1"
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64 --max-workers=2 --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: pocketops-android-debug-x86_64
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: npm exec --workspace=mobile -- expo prebuild --platform ios
        env:
          CI: "1"
      - run: >-
          xcodebuild -workspace mobile/ios/PocketOps.xcworkspace -scheme PocketOps
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/pocketops-ios CODE_SIGNING_ALLOWED=NO build
